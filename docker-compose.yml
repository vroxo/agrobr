services:
  db:
    container_name: insurance-db
    environment:
      POSTGRES_DB: insurance
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insurance-premium-api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      INSURANCE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/insurance
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
